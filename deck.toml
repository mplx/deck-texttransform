[package]
name = "@mplx/xformat"
version = "0.1.0"
description = "Text transformations in printf's modifier style: case conversions (snake, kebab, camel, pascal, leet, ...), slicing, truncation"
license = "LGPL-3.0-only"
authors = ["mplx <mplx@jennifer-lang.dev>"]
capabilities = []
keywords = ["format", "case", "snake-case", "camel-case", "kebab-case", "slugify", "leet", "strings"]

[package.urls]
deck = "https://raw.githubusercontent.com/mplx/deck-xformat/main/deck.toml"
homepage = "https://github.com/mplx/deck-xformat"
manual = "https://mplx.github.io/deck-xformat/"

[engines]
jennifer = ">=0.26.0"
