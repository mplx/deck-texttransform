[package]
name = "@mplx/texttransform"
version = "0.3.0"
description = "Text transformations in printf's modifier style: case conversions (snake, kebab, camel, pascal, leet, ...), slicing, truncation"
license = "LGPL-3.0-only"
authors = ["mplx <mplx@jennifer-lang.dev>"]
capabilities = []
keywords = ["text-transform", "case", "snake-case", "camel-case", "kebab-case", "slugify", "leet", "strings"]

[package.urls]
deck = "https://raw.githubusercontent.com/mplx/deck-texttransform/main/deck.toml"
homepage = "https://github.com/mplx/deck-texttransform"
manual = "https://mplx.github.io/deck-texttransform/"

[engines]
jennifer = ">=0.26.0"
