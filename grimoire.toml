# Grimoire book configuration for the @mplx/texttransform documentation.

[book]
title = "@mplx/texttransform"
description = "Text transformations in printf's modifier style: case conversions (snake, kebab, camel, pascal, leet, ...), slicing, truncation"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "nordic"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://mplx.github.io/deck-texttransform/"
repoUrl = "https://github.com/mplx/deck-texttransform"
repoLabel = "Source"
editUrl = "https://github.com/mplx/deck-texttransform/edit/main/docs/{path}"

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
